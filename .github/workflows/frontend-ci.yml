name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'apps/web/.env.local'
      - 'libs/shared/**'
      - 'package.json'
      - 'bun.lock'
      - 'package-lock.json'
      - '.github/workflows/frontend-ci.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install root dependencies
        working-directory: ./
        run: bun install

      - name: Install web dependencies
        run: bun install

      - name: Build Next.js (typecheck + lint via Next build)
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
        run: bun run build

      - name: Trigger Dokploy frontend deploy webhook
        if: success()
        env:
          WEBHOOK_URL: ${{ secrets.DOKPLOY_FE_WEBHOOK }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "::warning::DOKPLOY_FE_WEBHOOK secret is not set; skipping deploy trigger."
            exit 0
          fi
          echo "Triggering Dokploy frontend deploy webhook..."
          curl -fsS -X POST "$WEBHOOK_URL"
          echo "Frontend deploy webhook triggered."
